<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fazer login – auth4</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth">
  <main class="auth-card" id="card">
    <div class="progress" role="progressbar" aria-label="Carregando"></div>
    <div class="auth-grid">
      <div class="auth-head" id="head">
        <div id="logo"></div>
        <p class="env-badge" data-testid="env-badge">Ambiente para testes de automação</p>
        <h1 id="title"></h1>
        <div id="subtitle"></div>
      </div>
      <form class="auth-body" id="form" novalidate autocomplete="on"></form>
    </div>
    <div class="auth-actions" id="actions"></div>
  </main>
  <div id="footer"></div>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
